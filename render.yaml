# Free test backend; Vercel hosts the frontend, Supabase hosts private data/files.
# No Render database, paid instance, persistent disk or MinIO service is created.
services:
  - type: web
    name: nivado-atlas-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    healthCheckPath: /health-check
    dockerCommand: >-
      sh -c 'export PUBLIC_API_URL="$RENDER_EXTERNAL_URL"; exec java --add-opens=java.base/java.lang=ALL-UNNAMED $JAVA_OPTS -jar /app/my-spring-boot-app.jar'
    envVars:
      - key: SERVER_PORT
        value: "10000"
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: JAVA_OPTS
        value: "-Xms64m -Xmx280m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=32m -Xss256k -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError"
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
        value: "5"
      - key: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
        value: "1"
      - key: SPRING_LIQUIBASE_DEFAULT_SCHEMA
        value: atlas
      - key: SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA
        value: atlas
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PWD
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: PUBLIC_FRONT_URL
        value: https://atlas-cmms.vercel.app
      - key: PUBLIC_HOME_URL
        value: https://atlas-cmms.vercel.app
      - key: ENABLE_CORS
        value: "true"
      - key: SINGLE_INGRESS
        value: "false"
      - key: STORAGE_TYPE
        value: SUPABASE
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: atlas-files
      - key: MAIL_RECIPIENTS
        value: ""
      - key: ENABLE_EMAIL_NOTIFICATIONS
        value: "false"
      - key: ENABLE_MAIL_HEALTH_CHECK
        value: "false"
      - key: ALLOWED_ORGANIZATION_ADMINS
        sync: false
